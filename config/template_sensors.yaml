# Sensores de contagem de luzes acesas por cômodo.
# Replicam o padrão da dashboard de referência (var_sensor do template room_card),
# permitindo que os badges usem `entity` + `state:` em vez de templates JS
# (que não funcionam em cards aninhados por falta de propagação do hass).
- sensor:
    - name: "Luzes Sala de Estar"
      unique_id: luzes_sala_de_estar_count
      state: >
        {{ ['light.luz_sala', 'light.painel']
           | map('states') | select('eq', 'on') | list | count }}

    - name: "Luzes Cozinha"
      unique_id: luzes_cozinha_count
      state: >
        {{ ['light.cozinha_copa_varanda_switch_1']
           | map('states') | select('eq', 'on') | list | count }}

    - name: "Luzes Copa"
      unique_id: luzes_copa_count
      state: >
        {{ ['light.cozinha_copa_varanda_switch_2']
           | map('states') | select('eq', 'on') | list | count }}

    - name: "Luzes Lavanderia"
      unique_id: luzes_lavanderia_count
      state: >
        {{ ['light.cozinha_copa_varanda_switch_3']
           | map('states') | select('eq', 'on') | list | count }}

    - name: "Luzes Area Gourmet"
      unique_id: luzes_area_gourmet_count
      state: >
        {{ ['light.luzes_externas_switch_1', 'light.luzes_externas_switch_2',
             'light.luzes_externas_switch_3', 'light.luzes_externas_switch_4']
           | map('states') | select('eq', 'on') | list | count }}

    - name: "Luzes Quarto do Luca"
      unique_id: luzes_quarto_luca_count
      state: >
        {{ ['light.quarto_luca_switch_1']
           | map('states') | select('eq', 'on') | list | count }}

    - name: "Luzes Banheiro"
      unique_id: luzes_banheiro_count
      state: >
        {{ ['switch.banheiro_switch_1', 'switch.banheiro_switch_2']
           | map('states') | select('eq', 'on') | list | count }}

    - name: "Luzes Circulacao"
      unique_id: luzes_circulacao_count
      state: >
        {{ ['light.corredor']
           | map('states') | select('eq', 'on') | list | count }}

    - name: "Luzes Closet"
      unique_id: luzes_closet_count
      state: >
        {{ ['light.closet_switch_1', 'light.led_escritorio_sonoff_1001dff472']
           | map('states') | select('eq', 'on') | list | count }}

    # Total de luzes de AMBIENTE acesas na casa.
    # Usa a mesma curadoria da página "Luzes" — exclui de propósito as
    # luzes de fundo dos interruptores (light.*_luz_de_fundo), que são
    # indicadores do botão e não iluminação do cômodo.
    - name: "Luzes Acesas Total"
      unique_id: luzes_acesas_total
      icon: mdi:lightbulb-group
      state: >
        {{ ['light.luz_sala', 'light.painel',
            'light.cozinha_copa_varanda_switch_3',
            'light.cozinha_copa_varanda_switch_2',
            'light.cozinha_copa_varanda_switch_1',
            'light.luzes_externas_switch_1', 'light.luzes_externas_switch_2',
            'light.luzes_externas_switch_3', 'light.luzes_externas_switch_4',
            'light.quarto_luca_switch_1',
            'switch.banheiro_switch_1', 'switch.banheiro_switch_2',
            'light.corredor',
            'light.closet_switch_1', 'light.led_escritorio_sonoff_1001dff472']
           | map('states') | select('eq', 'on') | list | count }}

# ---------------------------------------------------------------------------
# Saúde (Apple Saúde -> Atalhos do iPhone -> webhook do HA)
#
# O relógio Garmin sincroniza com o Apple Saúde; um Atalho no iPhone lê os
# valores do dia e faz um POST em /api/webhook/<webhook_saude> com um JSON
# simples. Cada sensor abaixo só muda quando esse POST chega, e mantém o
# último valor quando o campo não vem no JSON (`default` com o estado atual).
#
# Campos esperados: passos, distancia, calorias, fc_repouso, sono
# ---------------------------------------------------------------------------
- trigger:
    - platform: webhook
      webhook_id: !secret webhook_saude
      allowed_methods:
        - POST
      # false porque o iPhone fora de casa chega pelo Tailscale (rede 100.x),
      # que não conta como local para o Home Assistant.
      local_only: false
  sensor:
    - name: "Saúde Passos"
      unique_id: saude_passos
      state: "{{ trigger.json.passos | default(states('sensor.saude_passos'), true) | int(0) }}"
      unit_of_measurement: "passos"
      state_class: measurement
      icon: mdi:shoe-print

    - name: "Saúde Distância"
      unique_id: saude_distancia
      state: "{{ trigger.json.distancia | default(states('sensor.saude_distancia'), true) | float(0) | round(2) }}"
      unit_of_measurement: "km"
      state_class: measurement
      icon: mdi:map-marker-distance

    - name: "Saúde Calorias"
      unique_id: saude_calorias
      state: "{{ trigger.json.calorias | default(states('sensor.saude_calorias'), true) | int(0) }}"
      unit_of_measurement: "kcal"
      state_class: measurement
      icon: mdi:fire

    - name: "Saúde FC de repouso"
      unique_id: saude_fc_repouso
      state: "{{ trigger.json.fc_repouso | default(states('sensor.saude_fc_repouso'), true) | int(0) }}"
      unit_of_measurement: "bpm"
      state_class: measurement
      icon: mdi:heart-pulse

    - name: "Saúde Sono"
      unique_id: saude_sono
      state: "{{ trigger.json.sono | default(states('sensor.saude_sono'), true) | float(0) | round(1) }}"
      unit_of_measurement: "h"
      state_class: measurement
      icon: mdi:sleep

    - name: "Saúde Atualizado em"
      unique_id: saude_atualizado_em
      state: "{{ now().isoformat() }}"
      device_class: timestamp
      icon: mdi:clock-check-outline

# Contexto de mídia da sala. Medido em 09/09/2026 com TV e PS5 ligados:
#   - a TV local (SamsungTV) não reporta nem a fonte atual;
#   - a TV de nuvem (SmartThings) é a única que reporta `source`;
#   - o PS5 responde `title_name: null` mesmo com jogo aberto — o console não
#     anuncia o app pelo DDP, então o nome do jogo não existe por aqui.
# Daí estes dois: um traduz a fonte, o outro cruza fonte + console para dizer o
# que está acontecendo, que é o mais perto do "conteúdo em uso" possível hoje.
- sensor:
    # Estado consolidado da TV da sala. A nuvem (SmartThings) falha de dois jeitos:
    # cai (24/09/2026: falha de autenticação, `unavailable` por horas) e CONGELA
    # (05/10/2026: `on` desde 01/10 com a TV desligada — a regra antiga "qualquer
    # caminho `on` vence" fazia o painel mostrar a TV ligada por 4 dias e oferecer
    # "Desligar" que mandava ligar). Regra: a TV local (SamsungTV, rede da casa)
    # decide sempre que tiver leitura; a nuvem só quando a local estiver muda; senão
    # `unavailable` — sem leitura nunca é apresentado como desligada. É a mesma
    # regra da automação "Boa noite". Os atributos de fonte só existem quando a
    # nuvem responde. Especificação: specs/features/painel-estados-verdadeiros.md.
    - name: "TV Sala Estado"
      unique_id: tv_sala_estado
      icon: mdi:television
      state: >
        {% set n = states('media_player.sala_de_estar_tv') %}
        {% set l = states('media_player.tv_un65du8000gxzd') %}
        {% if l == 'on' %}
          on
        {% elif l in ['off', 'standby'] %}
          off
        {% elif n == 'on' %}
          on
        {% elif n in ['off', 'standby'] %}
          off
        {% else %}
          unavailable
        {% endif %}
      attributes:
        origem: >
          {% set n = states('media_player.sala_de_estar_tv') %}
          {% set l = states('media_player.tv_un65du8000gxzd') %}
          {% if n in ['on', 'off', 'standby'] and l in ['on', 'off', 'standby'] %}nuvem+local
          {% elif n in ['on', 'off', 'standby'] %}nuvem
          {% elif l in ['on', 'off', 'standby'] %}local
          {% else %}nenhuma{% endif %}
        source: "{{ state_attr('media_player.sala_de_estar_tv', 'source') }}"
        # Leituras reais do SmartThings. Nulas quando a nuvem não responde — o painel
        # mostra "sem leitura" em vez de inventar um valor padrão.
        volume_level: >
          {% set v = state_attr('media_player.sala_de_estar_tv', 'volume_level') %}
          {{ v if v is number else none }}
        is_volume_muted: >
          {% set m = state_attr('media_player.sala_de_estar_tv', 'is_volume_muted') %}
          {{ m if m is boolean else none }}
        canal_nome: >
          {% set c = states('sensor.sala_de_estar_tv_nome_do_canal_de_tv') %}
          {{ none if c in ['', 'unavailable', 'unknown', 'none'] or c.startswith('com.') else c }}
        canal_numero: >
          {% set c = states('sensor.sala_de_estar_tv_canal_de_tv') %}
          {{ none if c in ['', 'unavailable', 'unknown', 'none'] else c }}
        app_id: >
          {% set c = states('sensor.sala_de_estar_tv_nome_do_canal_de_tv') %}
          {{ c if c.startswith('com.') else none }}
        leitura_nuvem: "{{ states('media_player.sala_de_estar_tv') in ['on', 'off', 'standby'] }}"

    - name: "TV Fonte"
      unique_id: tv_fonte_legivel
      icon: mdi:television-guide
      state: >
        {% set tv = states('sensor.tv_sala_estado') %}
        {% if tv == 'on' %}
          {% set f = state_attr('media_player.sala_de_estar_tv', 'source') %}
          {{ {'hdmi1': 'HDMI 1', 'hdmi2': 'HDMI 2', 'hdmi3': 'HDMI 3',
              'hdmi4': 'HDMI 4', 'digital_tv': 'TV aberta'}.get(f, f or 'Ligada') }}
        {% elif tv == 'off' %}
          Desligada
        {% else %}
          Indisponível
        {% endif %}

    - name: "Sala Atividade"
      unique_id: sala_atividade
      icon: >
        {% set ps5 = states('media_player.sala_de_estar_ps5') %}
        {% set tv = states('sensor.tv_sala_estado') %}
        {% if ps5 == 'on' and state_attr('media_player.sala_de_estar_tv', 'source') == 'hdmi1' %}
          mdi:sony-playstation
        {% elif tv == 'on' %}
          mdi:television-play
        {% else %}
          mdi:sofa-outline
        {% endif %}
      state: >
        {% set ps5 = states('media_player.sala_de_estar_ps5') %}
        {% set tv = states('sensor.tv_sala_estado') %}
        {% set fonte = state_attr('media_player.sala_de_estar_tv', 'source') %}
        {% if ps5 == 'on' and tv == 'on' and fonte == 'hdmi1' %}
          Jogando no PS5
        {% elif ps5 == 'on' %}
          PS5 ligado
        {% elif tv == 'on' %}
          {{ states('sensor.tv_fonte') }}
        {% elif tv == 'unavailable' %}
          Sem leitura da TV
        {% else %}
          Sala livre
        {% endif %}
      attributes:
        ps5: "{{ states('media_player.sala_de_estar_ps5') }}"
        tv: "{{ states('sensor.tv_sala_estado') }}"
        fonte: "{{ state_attr('media_player.sala_de_estar_tv', 'source') }}"

# --- Rede: internet, mesh e luzes (specs/automations/rede-mesh-internet-monitoramento.md) ---
- binary_sensor:
    - name: "Internet no Ar"
      unique_id: internet_no_ar
      device_class: connectivity
      # Disponível se algum destino responde ou se os dois confirmam "sem resposta".
      # Um `off` + `unavailable` não prova nada: fica indisponível, não "caiu".
      availability: >
        {% set a = states('binary_sensor.rede_internet_cloudflare') %}
        {% set b = states('binary_sensor.rede_internet_google') %}
        {{ a == 'on' or b == 'on' or (a == 'off' and b == 'off') }}
      state: >
        {{ is_state('binary_sensor.rede_internet_cloudflare', 'on')
           or is_state('binary_sensor.rede_internet_google', 'on') }}

    - name: "Rede Nó Sala Online"
      unique_id: rede_no_sala_online
      device_class: connectivity
      # Sem IP confirmado do nó da Sala, a saúde dele é a disponibilidade da entidade do RD15.
      # Só vale enquanto o Closet (que fala com a mesma nuvem Xiaomi) estiver disponível.
      availability: >
        {{ states('sensor.xiaomi_cn_771718035_rd15_connected_device_number_p_2_3') not in ['unavailable', 'unknown'] }}
      state: >
        {{ states('sensor.xiaomi_cn_863726955_rd15_connected_device_number_p_2_3') not in ['unavailable', 'unknown'] }}

- sensor:
    - name: "Rede Diagnóstico"
      unique_id: rede_diagnostico
      icon: mdi:lan-check
      state: >
        {% set gw = states('binary_sensor.rede_gateway') %}
        {% set net = states('binary_sensor.internet_no_ar') %}
        {% set sala = states('binary_sensor.rede_no_sala_online') %}
        {% if gw not in ['on', 'off'] or (gw == 'on' and net not in ['on', 'off']) %}
          indeterminado
        {% elif gw == 'off' %}
          sem_gateway
        {% elif net == 'off' %}
          sem_internet
        {% elif sala == 'off' %}
          no_mesh_fora
        {% else %}
          ok
        {% endif %}

    - name: "Luzes Indisponíveis"
      unique_id: luzes_indisponiveis
      icon: mdi:lightbulb-alert-outline
      unit_of_measurement: luzes
      # Lista explícita. Fora: tela do iPad (browser_mod), LED dos roteadores e o Yeelight
      # aposentado (bslamp2), que vive `unavailable`.
      state: >
        {% set luzes = [
          'light.banheiro_luz_de_fundo', 'light.corredor',
          'light.closet_switch_1', 'light.cozinha_copa_varanda_switch_1',
          'light.cozinha_copa_varanda_switch_2', 'light.cozinha_copa_varanda_switch_3',
          'light.entrada_luz_de_fundo', 'light.led_escritorio_sonoff_1001dff472',
          'light.luz_quarto', 'light.luz_sala', 'light.luzes_externas_luz_de_fundo',
          'light.luzes_externas_switch_1', 'light.luzes_externas_switch_2',
          'light.luzes_externas_switch_3', 'light.luzes_externas_switch_4',
          'light.painel', 'light.quarto_luca_switch_1'] %}
        {{ luzes | select('is_state', 'unavailable') | list | count }}
      attributes:
        entidades: >
          {% set luzes = [
            'light.banheiro_luz_de_fundo', 'light.corredor',
            'light.closet_switch_1', 'light.cozinha_copa_varanda_switch_1',
            'light.cozinha_copa_varanda_switch_2', 'light.cozinha_copa_varanda_switch_3',
            'light.entrada_luz_de_fundo', 'light.led_escritorio_sonoff_1001dff472',
            'light.luz_quarto', 'light.luz_sala', 'light.luzes_externas_luz_de_fundo',
            'light.luzes_externas_switch_1', 'light.luzes_externas_switch_2',
            'light.luzes_externas_switch_3', 'light.luzes_externas_switch_4',
            'light.painel', 'light.quarto_luca_switch_1'] %}
          {{ luzes | select('is_state', 'unavailable')
                   | map('state_attr', 'friendly_name') | list | join(', ') }}

# Luz do Quarto do Luca: expõe como `light` a tecla 1 do interruptor de 2 teclas "Circulação"
# (switch.circulacao_switch_1), mantendo o entity_id de antes (light.quarto_luca_switch_1), porque painel e
# contadores acima dependem dele.
# Em 26/10/2026 o interruptor "Circulação" (2 teclas) foi para o Quarto Luca (tecla 1 = luz, tecla 2 = LED da
# cabeceira); o "Entrada" (2 teclas) deixou de existir; o de 1 tecla (switch.quarto_luca_switch_1) segue só
# no Corredor; o Muro ficou com interruptor manual, sem automação. Não decide nada: só repassa liga/desliga e
# estado ao interruptor (um atuador, um dono).
- light:
    - name: "Quarto Luca Switch 1"
      unique_id: quarto_luca_luz_wrapper
      state: "{{ is_state('switch.circulacao_switch_1', 'on') }}"
      availability: "{{ states('switch.circulacao_switch_1') not in ['unavailable', 'unknown'] }}"
      turn_on:
        - action: switch.turn_on
          target:
            entity_id: switch.circulacao_switch_1
      turn_off:
        - action: switch.turn_off
          target:
            entity_id: switch.circulacao_switch_1

    # Luz do Corredor: o interruptor de 1 tecla (switch.quarto_luca_switch_1, dispositivo "Quarto Luca") é o
    # único que a comanda desde 26/10/2026. Só repassa liga/desliga e estado.
    - name: "Corredor"
      unique_id: corredor_luz_wrapper
      state: "{{ is_state('switch.quarto_luca_switch_1', 'on') }}"
      availability: "{{ states('switch.quarto_luca_switch_1') not in ['unavailable', 'unknown'] }}"
      turn_on:
        - action: switch.turn_on
          target:
            entity_id: switch.quarto_luca_switch_1
      turn_off:
        - action: switch.turn_off
          target:
            entity_id: switch.quarto_luca_switch_1
