# Sensores de contagem de luzes acesas por cômodo.
# Replicam o padrão da dashboard de referência (var_sensor do template room_card),
# permitindo que os badges usem `entity` + `state:` em vez de templates JS
# (que não funcionam em cards aninhados por falta de propagação do hass).
- sensor:
    - name: "Luzes Sala de Estar"
      unique_id: luzes_sala_de_estar_count
      state: >
        {{ ['light.luz_sala', 'light.painel']
           | map('states') | select('eq', 'on') | list | count }}

    - name: "Luzes Cozinha"
      unique_id: luzes_cozinha_count
      state: >
        {{ ['light.cozinha_copa_varanda_switch_1']
           | map('states') | select('eq', 'on') | list | count }}

    - name: "Luzes Copa"
      unique_id: luzes_copa_count
      state: >
        {{ ['light.cozinha_copa_varanda_switch_2']
           | map('states') | select('eq', 'on') | list | count }}

    - name: "Luzes Lavanderia"
      unique_id: luzes_lavanderia_count
      state: >
        {{ ['light.cozinha_copa_varanda_switch_3']
           | map('states') | select('eq', 'on') | list | count }}

    - name: "Luzes Area Gourmet"
      unique_id: luzes_area_gourmet_count
      state: >
        {{ ['light.luzes_externas_switch_1', 'light.luzes_externas_switch_2',
             'light.luzes_externas_switch_3', 'light.luzes_externas_switch_4']
           | map('states') | select('eq', 'on') | list | count }}

    - name: "Luzes Quarto do Luca"
      unique_id: luzes_quarto_luca_count
      state: >
        {{ ['light.quarto_luca_switch_1']
           | map('states') | select('eq', 'on') | list | count }}

    - name: "Luzes Banheiro"
      unique_id: luzes_banheiro_count
      state: >
        {{ ['switch.banheiro_switch_1', 'switch.banheiro_switch_2']
           | map('states') | select('eq', 'on') | list | count }}

    - name: "Luzes Circulacao"
      unique_id: luzes_circulacao_count
      state: >
        {{ ['light.circulacao_switch_1', 'light.circulacao_switch_2']
           | map('states') | select('eq', 'on') | list | count }}

    - name: "Luzes Closet"
      unique_id: luzes_closet_count
      state: >
        {{ ['light.closet_switch_1', 'light.led_escritorio_sonoff_1001dff472']
           | map('states') | select('eq', 'on') | list | count }}

    # Total de luzes de AMBIENTE acesas na casa.
    # Usa a mesma curadoria da página "Luzes" — exclui de propósito as
    # luzes de fundo dos interruptores (light.*_luz_de_fundo), que são
    # indicadores do botão e não iluminação do cômodo.
    - name: "Luzes Acesas Total"
      unique_id: luzes_acesas_total
      icon: mdi:lightbulb-group
      state: >
        {{ ['light.luz_sala', 'light.painel',
            'light.cozinha_copa_varanda_switch_3',
            'light.cozinha_copa_varanda_switch_2',
            'light.cozinha_copa_varanda_switch_1',
            'light.luzes_externas_switch_1', 'light.luzes_externas_switch_2',
            'light.luzes_externas_switch_3', 'light.luzes_externas_switch_4',
            'light.quarto_luca_switch_1',
            'switch.banheiro_switch_1', 'switch.banheiro_switch_2',
            'light.circulacao_switch_1', 'light.circulacao_switch_2',
            'light.closet_switch_1', 'light.led_escritorio_sonoff_1001dff472']
           | map('states') | select('eq', 'on') | list | count }}

# ---------------------------------------------------------------------------
# Saúde (Apple Saúde -> Atalhos do iPhone -> webhook do HA)
#
# O relógio Garmin sincroniza com o Apple Saúde; um Atalho no iPhone lê os
# valores do dia e faz um POST em /api/webhook/<webhook_saude> com um JSON
# simples. Cada sensor abaixo só muda quando esse POST chega, e mantém o
# último valor quando o campo não vem no JSON (`default` com o estado atual).
#
# Campos esperados: passos, distancia, calorias, fc_repouso, sono
# ---------------------------------------------------------------------------
- trigger:
    - platform: webhook
      webhook_id: !secret webhook_saude
      allowed_methods:
        - POST
      # false porque o iPhone fora de casa chega pelo Tailscale (rede 100.x),
      # que não conta como local para o Home Assistant.
      local_only: false
  sensor:
    - name: "Saúde Passos"
      unique_id: saude_passos
      state: "{{ trigger.json.passos | default(states('sensor.saude_passos'), true) | int(0) }}"
      unit_of_measurement: "passos"
      state_class: measurement
      icon: mdi:shoe-print

    - name: "Saúde Distância"
      unique_id: saude_distancia
      state: "{{ trigger.json.distancia | default(states('sensor.saude_distancia'), true) | float(0) | round(2) }}"
      unit_of_measurement: "km"
      state_class: measurement
      icon: mdi:map-marker-distance

    - name: "Saúde Calorias"
      unique_id: saude_calorias
      state: "{{ trigger.json.calorias | default(states('sensor.saude_calorias'), true) | int(0) }}"
      unit_of_measurement: "kcal"
      state_class: measurement
      icon: mdi:fire

    - name: "Saúde FC de repouso"
      unique_id: saude_fc_repouso
      state: "{{ trigger.json.fc_repouso | default(states('sensor.saude_fc_repouso'), true) | int(0) }}"
      unit_of_measurement: "bpm"
      state_class: measurement
      icon: mdi:heart-pulse

    - name: "Saúde Sono"
      unique_id: saude_sono
      state: "{{ trigger.json.sono | default(states('sensor.saude_sono'), true) | float(0) | round(1) }}"
      unit_of_measurement: "h"
      state_class: measurement
      icon: mdi:sleep

    - name: "Saúde Atualizado em"
      unique_id: saude_atualizado_em
      state: "{{ now().isoformat() }}"
      device_class: timestamp
      icon: mdi:clock-check-outline

# Contexto de mídia da sala. Medido em 09/09/2026 com TV e PS5 ligados:
#   - a TV local (SamsungTV) não reporta nem a fonte atual;
#   - a TV de nuvem (SmartThings) é a única que reporta `source`;
#   - o PS5 responde `title_name: null` mesmo com jogo aberto — o console não
#     anuncia o app pelo DDP, então o nome do jogo não existe por aqui.
# Daí estes dois: um traduz a fonte, o outro cruza fonte + console para dizer o
# que está acontecendo, que é o mais perto do "conteúdo em uso" possível hoje.
- sensor:
    - name: "TV Fonte"
      unique_id: tv_fonte_legivel
      icon: mdi:television-guide
      state: >
        {% set tv = states('media_player.sala_de_estar_tv') %}
        {% if tv in ['off', 'unavailable', 'unknown', 'standby'] %}
          Desligada
        {% else %}
          {% set f = state_attr('media_player.sala_de_estar_tv', 'source') %}
          {{ {'hdmi1': 'HDMI 1', 'hdmi2': 'HDMI 2', 'hdmi3': 'HDMI 3',
              'hdmi4': 'HDMI 4', 'digital_tv': 'TV aberta'}.get(f, f or 'Ligada') }}
        {% endif %}

    - name: "Sala Atividade"
      unique_id: sala_atividade
      icon: >
        {% set ps5 = states('media_player.sala_de_estar_ps5') %}
        {% set tv = states('media_player.sala_de_estar_tv') %}
        {% if ps5 == 'on' and state_attr('media_player.sala_de_estar_tv', 'source') == 'hdmi1' %}
          mdi:sony-playstation
        {% elif tv not in ['off', 'unavailable', 'unknown', 'standby'] %}
          mdi:television-play
        {% else %}
          mdi:sofa-outline
        {% endif %}
      state: >
        {% set ps5 = states('media_player.sala_de_estar_ps5') %}
        {% set tv = states('media_player.sala_de_estar_tv') %}
        {% set fonte = state_attr('media_player.sala_de_estar_tv', 'source') %}
        {% set tv_ligada = tv not in ['off', 'unavailable', 'unknown', 'standby'] %}
        {% if ps5 == 'on' and tv_ligada and fonte == 'hdmi1' %}
          Jogando no PS5
        {% elif ps5 == 'on' %}
          PS5 ligado
        {% elif tv_ligada %}
          {{ states('sensor.tv_fonte') }}
        {% else %}
          Sala livre
        {% endif %}
      attributes:
        ps5: "{{ states('media_player.sala_de_estar_ps5') }}"
        tv: "{{ states('media_player.sala_de_estar_tv') }}"
        fonte: "{{ state_attr('media_player.sala_de_estar_tv', 'source') }}"
