<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#07090e">
  <title>Casa · Painel paralelo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="styles.css?v=f72ce4ee80">
</head>
<body data-tab="casa" data-net="carregando">
  <div class="hero-bg" aria-hidden="true">
    <svg viewBox="0 0 1600 600" preserveAspectRatio="xMidYMax slice" focusable="false">
      <defs>
        <linearGradient id="ceu" x1="0" y1="0" x2="0" y2="1">
          <stop class="s0" offset="0"/>
          <stop class="s1" offset=".38"/>
          <stop class="s2" offset=".72"/>
          <stop class="s3" offset="1"/>
        </linearGradient>
        <radialGradient id="halo">
          <stop offset="0" stop-color="currentColor" stop-opacity=".55"/>
          <stop offset="1" stop-color="currentColor" stop-opacity="0"/>
        </radialGradient>
        <radialGradient id="atmosfera">
          <stop offset="0" stop-color="currentColor" stop-opacity=".30"/>
          <stop offset=".5" stop-color="currentColor" stop-opacity=".08"/>
          <stop offset="1" stop-color="currentColor" stop-opacity="0"/>
        </radialGradient>
        <linearGradient id="bruma" x1="0" y1="0" x2="0" y2="1">
          <stop class="s3" offset="0" stop-opacity="0"/>
          <stop class="s3" offset="1" stop-opacity=".75"/>
        </linearGradient>
        <linearGradient id="gSerra0" x1="0" y1="0" x2="0" y2="1">
          <stop class="mf" offset="0"/><stop class="s3" offset="1"/>
        </linearGradient>
        <linearGradient id="gSerra1" x1="0" y1="0" x2="0" y2="1">
          <stop class="m1c" offset="0"/><stop class="mf" offset="1"/>
        </linearGradient>
        <filter id="macio" x="-20%" y="-60%" width="140%" height="220%"><feGaussianBlur stdDeviation="16"/></filter>
        <filter id="macio2" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="40"/></filter>
      </defs>
      <rect width="1600" height="600" fill="url(#ceu)"/>
      <ellipse class="via" cx="760" cy="150" rx="900" ry="70" transform="rotate(-18 760 150)" fill="#c7d2fe" filter="url(#macio2)"/>
      <g id="estrelas" class="estrelas" fill="#f8fafc"></g>
      <g class="astro">
        <circle class="atm" r="460" fill="url(#atmosfera)"/>
        <circle r="150" fill="url(#halo)"/>
        <circle class="disco" r="26"/>
        <g class="crateras"><circle cx="-7" cy="-6" r="5"/><circle cx="8" cy="5" r="7"/><circle cx="-4" cy="12" r="3.2"/></g>
      </g>
      <g class="nuvens" filter="url(#macio)">
        <g class="nv nv1"><ellipse cx="300" cy="190" rx="190" ry="20"/><ellipse cx="380" cy="172" rx="120" ry="18"/><ellipse cx="240" cy="176" rx="90" ry="14"/></g>
        <g class="nv nv2"><ellipse cx="980" cy="130" rx="230" ry="18"/><ellipse cx="1060" cy="114" rx="130" ry="15"/></g>
        <g class="nv nv3"><ellipse cx="1380" cy="260" rx="210" ry="22"/><ellipse cx="1300" cy="244" rx="110" ry="16"/><ellipse cx="1450" cy="246" rx="90" ry="14"/></g>
        <g class="nv nv4"><ellipse cx="640" cy="290" rx="170" ry="16"/><ellipse cx="700" cy="276" rx="90" ry="13"/></g>
      </g>
      <path class="m0" id="serra0" fill="url(#gSerra0)" d="M0 600V420H1600V600Z"/>
      <path class="m1" id="serra1" fill="url(#gSerra1)" d="M0 600V460H1600V600Z"/>
      <rect class="bruma" y="360" width="1600" height="240" fill="url(#bruma)"/>
      <path class="m2" id="serra2" d="M0 600V500H1600V600Z"/>
    </svg>
    <div class="ray"></div>
  </div>

  <div class="wrap">
    <header class="hero" id="secao-hero">
      <p class="banner" id="banner" role="status" hidden>
        <span class="banner-ico" aria-hidden="true"></span>
        <span id="banner-txt">Sem conexão com a casa. Mostrando o último estado conhecido; comandos pausados até reconectar.</span>
      </p>
      <p class="eyebrow" id="data-hoje"></p>
      <div class="hero-line">
        <h1 class="display" id="saudacao"></h1>
        <span class="status" id="status"></span>
      </div>
      <div class="chips">
        <ul class="chips-dados" id="resumo" aria-label="Resumo da casa"></ul>
        <button type="button" class="manut-chip" id="manut-chip" data-manut aria-haspopup="dialog" aria-label="Manutenção"></button>
      </div>
    </header>

    <section class="scenes" id="secao-cenas" aria-labelledby="t-cenas">
      <div class="sec-head">
        <h2 id="t-cenas">Cenas</h2>
        <p class="muted">Um toque, a casa inteira se ajusta.</p>
      </div>
      <div class="scene-grid" id="cenas"></div>
    </section>

    <main class="main">
      <nav class="rooms-nav" id="ambientes" aria-label="Ambientes">
        <span class="eyebrow amb-titulo">Ambientes</span>
        <ul id="lista-ambientes"></ul>
        <ul id="rail" class="rail glass"></ul>
      </nav>

      <section class="rooms" id="secao-casa" aria-label="Cômodos">
        <div class="lista-comodos" id="lista-comodos"></div>
      </section>

      <aside class="security" id="secao-cameras" aria-labelledby="t-seg">
        <div class="sec-head">
          <h2 id="t-seg">Segurança</h2>
          <p class="muted">Câmeras da rua · DVR Intelbras</p>
        </div>
        <div class="cams" id="cameras"></div>
      </aside>
    </main>

    <p class="proto">Protótipo · estados simulados · nenhum comando chega à casa</p>
  </div>

  <nav class="tabbar" aria-label="Seções">
    <button type="button" data-tab-btn="casa" aria-pressed="true"></button>
    <button type="button" data-tab-btn="cenas" aria-pressed="false"></button>
    <button type="button" data-tab-btn="cameras" aria-pressed="false"></button>
  </nav>

  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
  <div id="folha" hidden></div>
  <div id="manutencao" hidden></div>
  <div id="confirma" hidden></div>

  <script src="icons.js?v=f72ce4ee80"></script>
  <script src="casa-real.js?v=f72ce4ee80"></script>
  <script src="app.js?v=f72ce4ee80"></script>
</body>
</html>
