- id: '1757462400000'
  alias: Ventilação do PS5 acompanha o console
  description: >-
    Liga a tomada do ventilador externo (switch.ventilacao_ps5) quando o PS5
    entra em uso e desliga quando ele sai.

    Duas decisões que não são óbvias:

    1. O desligar espera 2 minutos. "unavailable" é um dos estados que o dispara,
    e a integração do PS5 fala por rede — uma oscilação de segundos cortaria a
    ventilação com o console ainda quente. Ligar não tem espera, aí o atraso
    seria justamente o que se quer evitar.

    2. A decisão é tomada pelo **estado atual** do console, não por qual gatilho
    disparou. A primeira versão usava `condition: trigger` e ficou surda: o PS5
    foi para "off" às 00:10:16, o container reiniciou às 00:12:17 e o
    temporizador pendente de 2 minutos morreu junto. Ao voltar, o console já
    estava "off" — sem transição nova, nada rearmava, e a ventilação teria ficado
    ligada indefinidamente. Com a decisão baseada em estado, mais os gatilhos de
    partida do Home Assistant e de tempo, a automação se reconcilia sozinha em no
    máximo 5 minutos, aconteça o que acontecer.
  mode: single
  triggers:
    - trigger: state
      entity_id: media_player.sala_de_estar_ps5
      to:
        - 'on'
        - playing
      id: entrou_em_uso
    - trigger: state
      entity_id: media_player.sala_de_estar_ps5
      to:
        - standby
        - 'off'
        - idle
        - unavailable
      for: '00:02:00'
      id: saiu_de_uso
    - trigger: homeassistant
      event: start
      id: partida
    - trigger: time_pattern
      minutes: /5
      id: reconciliacao
  conditions: []
  actions:
    - choose:
        - alias: Console em uso — ventilação ligada
          conditions:
            - condition: state
              entity_id: media_player.sala_de_estar_ps5
              state:
                - 'on'
                - playing
          sequence:
            - action: switch.turn_on
              target:
                entity_id: switch.ventilacao_ps5
        - alias: Console fora de uso há mais de 2 minutos — ventilação desligada
          conditions:
            - condition: template
              value_template: >-
                {% set ps5 = states.media_player.sala_de_estar_ps5 %}
                {{ ps5 is not none
                   and ps5.state not in ['on', 'playing']
                   and (now() - ps5.last_changed).total_seconds() > 120 }}
          sequence:
            - action: switch.turn_off
              target:
                entity_id: switch.ventilacao_ps5

- id: '1757980800000'
  alias: Porta do quarto fechada à noite apaga a casa
  description: >-
    Depois das 22h, fechar a porta do quarto é o gesto de "fui dormir": apaga
    todas as luzes e desliga a TV.

    A janela vai das 22h às 6h, e não apenas "depois das 22h". Uma condição de
    horário só com `after` cobriria das 22h à meia-noite e nada mais — fechar a
    porta à uma da manhã não faria nada, que é justamente quando mais se quer.
    Com `after` maior que `before`, o Home Assistant entende o intervalo como
    atravessando a meia-noite.

    As luzes são resolvidas por template, não por lista fixa, para que uma luz
    nova entre na rotina sozinha. Três famílias ficam de fora de propósito: as
    `luz_de_fundo` dos interruptores (são a marcação que se enxerga no escuro,
    apagá-las é o contrário do que se quer), o `indicator_light` dos roteadores
    (LED de equipamento de rede, não iluminação) e a tela do painel
    (`browser_mod`), que é um monitor e não uma lâmpada.

    ⚠️ A TV só recebe o comando **se estiver ligada**, e por **um caminho de
    cada vez**. A primeira versão mandava `turn_off` nos dois caminhos sempre,
    argumentando que desligar o que já está desligado não custaria nada. Custa:
    nesta Samsung o desligar viaja como tecla POWER, que é *alternador*. Com a
    TV apagada, o comando a acendia — medido no histórico, a porta fechava
    23:18:52 e a TV ligava 23:18:56. Dois caminhos ainda dobravam a aposta, um
    desligando e o outro tornando a ligar.

    Por isso o `choose`: o caminho local é o preferido, e o da nuvem só entra
    quando o local não está respondendo. Se a TV já estiver desligada, nenhum
    comando é enviado — que é o correto e, aqui, também o seguro.
  mode: single
  triggers:
    - trigger: state
      entity_id: binary_sensor.porta_do_quarto_porta
      from: 'on'
      to: 'off'
  conditions:
    - condition: time
      after: '22:00:00'
      before: '06:00:00'
  actions:
    - action: light.turn_off
      target:
        entity_id: >-
          {{ states.light | map(attribute='entity_id')
             | reject('search', 'luz_de_fundo')
             | reject('search', 'indicator_light')
             | reject('search', 'browser_mod')
             | list }}
    - choose:
        - alias: TV respondendo no caminho local e ligada
          conditions:
            - condition: template
              value_template: >-
                {{ states('media_player.tv_un65du8000gxzd')
                   not in ['off', 'standby', 'unavailable', 'unknown'] }}
          sequence:
            - action: media_player.turn_off
              target:
                entity_id: media_player.tv_un65du8000gxzd
        - alias: Caminho local mudo — tenta pela nuvem, se ela vir a TV ligada
          conditions:
            - condition: template
              value_template: >-
                {{ states('media_player.tv_un65du8000gxzd')
                     in ['unavailable', 'unknown']
                   and states('media_player.sala_de_estar_tv')
                     not in ['off', 'standby', 'unavailable', 'unknown'] }}
          sequence:
            - action: media_player.turn_off
              target:
                entity_id: media_player.sala_de_estar_tv

- id: '1757980800001'
  alias: Porta do quarto aberta à noite acende o painel
  description: >-
    O par da automação anterior: depois das 22h, abrir a porta do quarto acende
    a luz do painel da TV, que serve de luz de guia para quem sai do quarto no
    escuro.

    Mesma janela de 22h às 6h, pelo mesmo motivo.
  mode: single
  triggers:
    - trigger: state
      entity_id: binary_sensor.porta_do_quarto_porta
      from: 'off'
      to: 'on'
  conditions:
    - condition: time
      after: '22:00:00'
      before: '06:00:00'
  actions:
    - action: light.turn_on
      target:
        entity_id: light.painel

- id: '1757984400000'
  alias: Movimento na Lavanderia acende a luz à noite
  description: >-
    Do pôr do sol ao amanhecer, movimento na Lavanderia acende a luz; dez
    minutos sem movimento, ela apaga.

    O temporizador é o `for: '00:10:00'` no próprio gatilho de ausência: se
    alguém se mexer no meio da contagem, o sensor volta a `on` e o Home
    Assistant descarta o agendamento — a contagem recomeça do zero sozinha, sem
    precisar de `timer` nem de `input_datetime`.

    ⚠️ A condição de sol está **só no acender**. Se ela também guardasse o
    apagar, uma luz acesa às 5h50 ficaria acesa para sempre: o sol nasceria, a
    condição passaria a ser falsa e o desligamento nunca aconteceria. Apagar por
    ausência é seguro a qualquer hora; acender é que só faz sentido no escuro.
  mode: queued
  max: 5
  triggers:
    - trigger: state
      entity_id: binary_sensor.sensor_lavanderia_movimento
      to: 'on'
      id: chegou
    - trigger: state
      entity_id: binary_sensor.sensor_lavanderia_movimento
      to: 'off'
      for: '00:10:00'
      id: vazio
  conditions: []
  actions:
    - choose:
        - alias: Movimento com o sol abaixo do horizonte — acende
          conditions:
            - condition: trigger
              id: chegou
            - condition: state
              entity_id: sun.sun
              state: below_horizon
          sequence:
            - action: light.turn_on
              target:
                entity_id: light.cozinha_copa_varanda_switch_3
        - alias: Dez minutos sem ninguém — apaga, a qualquer hora
          conditions:
            - condition: trigger
              id: vazio
          sequence:
            - action: light.turn_off
              target:
                entity_id: light.cozinha_copa_varanda_switch_3

- id: '1757984400001'
  alias: Movimento na Área Gourmet acende as luzes à noite
  description: >-
    O par da automação da Lavanderia, com as quatro luzes da Área Gourmet —
    Plafons, Pendente, Led e Spots. Mesma regra: acende com movimento depois do
    pôr do sol, apaga dez minutos depois que a área esvazia.

    Valem as mesmas duas decisões: o temporizador é o `for` do gatilho, que se
    reinicia sozinho a cada movimento novo, e a condição de sol guarda apenas o
    acender, para que o apagar funcione mesmo depois do amanhecer.
  mode: queued
  max: 5
  triggers:
    - trigger: state
      entity_id: binary_sensor.sensor_area_gourmet_movimento
      to: 'on'
      id: chegou
    - trigger: state
      entity_id: binary_sensor.sensor_area_gourmet_movimento
      to: 'off'
      for: '00:10:00'
      id: vazio
  conditions: []
  actions:
    - choose:
        - alias: Movimento com o sol abaixo do horizonte — acende
          conditions:
            - condition: trigger
              id: chegou
            - condition: state
              entity_id: sun.sun
              state: below_horizon
          sequence:
            - action: light.turn_on
              target:
                entity_id: &luzes_gourmet
                  - light.luzes_externas_switch_1
                  - light.luzes_externas_switch_2
                  - light.luzes_externas_switch_3
                  - light.luzes_externas_switch_4
        - alias: Dez minutos sem ninguém — apaga, a qualquer hora
          conditions:
            - condition: trigger
              id: vazio
          sequence:
            - action: light.turn_off
              target:
                entity_id: *luzes_gourmet

- id: '1758230400000'
  alias: Movimento nas câmeras da rua grava clipe de 30s
  description: >-
    O DVR Intelbras (canais 2 e 4, câmeras externas) detecta movimento e manda
    e-mail de alarme para an.diogo98@gmail.com (filtro do Gmail arquiva e
    aplica o marcador "DVR", sem notificar o André — o e-mail é só o sinal
    para esta automação, ver specs/features/clipes-movimento-nuvem.md).

    O assunto do e-mail é igual para os dois canais ("ALERTA DVR"), sem dizer
    qual câmera disparou — por isso a automação grava as DUAS câmeras a cada
    alarme, em vez de tentar identificar o canal pelo e-mail. O nome do
    arquivo (câmera + data + hora) já identifica cada clipe.

    O upload para o Google Drive NÃO é feito por esta automação — uma conta
    de serviço do Google Cloud não tem cota de armazenamento em Drive pessoal
    (só funciona em Google Workspace com "shared drives"). A sincronização é
    feita por uma Tarefa Agendada do Windows que roda `rclone` fora do
    container, direto na pasta montada (ver
    scripts/camera_upload/sincronizar_clipes_drive.ps1 e CASA.md).
  mode: queued
  max: 10
  triggers:
    - trigger: event
      event_type: imap_content
  conditions: []
  actions:
    - repeat:
        for_each:
          - camera.rua_canal_2
          - camera.rua_canal_4
        sequence:
          - action: camera.record
            target:
              entity_id: '{{ repeat.item }}'
            data:
              filename: >-
                /config/www/clipes_movimento/{{ repeat.item.split('.')[1] }}_{{
                now().strftime('%Y-%m-%d_%H-%M-%S') }}.mp4
              duration: 30

- id: '1758240000000'
  alias: Muro e Painel acesos do pôr do sol à meia-noite
  description: >-
    Todo dia, no pôr do sol, acende o Muro (light.circulacao_switch_1) e o
    Painel da TV (light.painel); à meia-noite apaga os dois.
    Especificação: specs/automations/luzes-muro-painel-noite.md.

    "Ou quando forem apagadas manualmente" não precisa de lógica: o acender é
    de borda, dispara uma única vez no evento de pôr do sol e nunca reacende.
    Por isso também não há reconciliação na partida para o acender — se o
    Home Assistant voltar às 21h, reacender desfaria um apagar manual.

    O apagar tem reconciliação estreita: se o HA estiver fora na virada da
    meia-noite e voltar até 00:30, apaga o que ficou aceso. Depois disso não
    mexe, porque o Painel pode ter sido aceso de propósito pela automação da
    porta do quarto, que é dona dele entre 22h e 6h e tem precedência.

    Donos dos atuadores: as duas automações da porta do quarto também tocam
    estas luzes (a de fechar apaga ambas, a de abrir acende o Painel). Não há
    conflito — nenhuma desfaz a outra dentro da mesma janela.
  mode: single
  triggers:
    - trigger: sun
      event: sunset
      id: acender
    - trigger: time
      at: '00:00:00'
      id: apagar
    - trigger: homeassistant
      event: start
      id: partida
  conditions: []
  actions:
    - choose:
        - alias: Pôr do sol — acende Muro e Painel
          conditions:
            - condition: trigger
              id: acender
          sequence:
            - action: light.turn_on
              target:
                entity_id:
                  - light.circulacao_switch_1
                  - light.painel
        - alias: Meia-noite (ou partida até 00:30) — apaga o que estiver aceso
          conditions:
            - condition: or
              conditions:
                - condition: trigger
                  id: apagar
                - condition: and
                  conditions:
                    - condition: trigger
                      id: partida
                    - condition: time
                      after: '00:00:00'
                      before: '00:30:00'
            - condition: template
              value_template: >-
                {{ is_state('light.circulacao_switch_1', 'on')
                   or is_state('light.painel', 'on') }}
          sequence:
            - action: light.turn_off
              target:
                entity_id: >-
                  {{ ['light.circulacao_switch_1', 'light.painel']
                     | select('is_state', 'on') | list }}
