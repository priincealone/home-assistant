# Sondas de rede por ICMP. Ver specs/automations/rede-mesh-internet-monitoramento.md (R-01, R-02, R-04).
# Por que command_line e não a integração ping: a plataforma YAML do ping não existe mais no
# HA 2026.9, e criar entradas novas exigiria a interface (ou editar core.config_entries, proibido).
# Timeout ou falha do processo deixa o sensor `unavailable`, nunca `off`: só resposta de "sem
# resposta" (ping devolve erro) vira OFF.
- binary_sensor:
    name: "Rede Gateway"
    unique_id: rede_ping_gateway
    device_class: connectivity
    command: "ping -c 2 -W 2 192.168.31.1 >/dev/null 2>&1 && echo ON || echo OFF"
    payload_on: "ON"
    payload_off: "OFF"
    scan_interval: 60
    command_timeout: 15

