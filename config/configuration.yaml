
# Loads default set of integrations. Do not remove.
default_config:

# Load frontend themes from the themes folder
frontend:
  themes: !include_dir_merge_named themes
  extra_module_url:
    # ?v= força os aparelhos a buscar a versão nova (a HA serve /local com cache de 31 dias).
    - /local/casa-panel.js?v=20261014

# Painel Nativo do Dashboard Next.js
panel_custom:
  - name: casa-panel
    sidebar_title: "Casa Inteligente"
    sidebar_icon: "mdi:home-variant"
    url_path: "casa"
    module_url: "/local/casa-panel.js?v=20261014"
    trust_external_script: true
    require_admin: false
    handle_safe_area: true
  # Painel Secundário (dashboard-lab, dados simulados): roda inteiro na HA, servido de /local/painel-secundario/ (ver scripts/manutencao/publicar_painel_secundario.mjs).
  - name: casa-painel-secundario
    sidebar_title: "Painel Secundário"
    sidebar_icon: "mdi:view-dashboard-outline"
    url_path: "painel-secundario"
    module_url: "/local/casa-painel-secundario.js?v=20261022c"
    trust_external_script: true
    require_admin: false
    handle_safe_area: true

automation: !include automations.yaml
script: !include scripts.yaml
scene: !include scenes.yaml
template: !include template_sensors.yaml
command_line: !include rede_ping.yaml

# Guarda se a queda de internet já foi avisada, para só avisar o retorno de queda que alarmou.
input_boolean:
  rede_queda_notificada:
    name: Queda de internet avisada
    icon: mdi:wifi-alert

# Silencia o aviso "Connection pool is full" da nuvem Tuya (apigw.tuyaus.com): a biblioteca
# descarta a conexão excedente e segue funcionando; o aviso é só ruído no log.
logger:
  default: warning
  logs:
    urllib3.connectionpool: error

# Mapa do aspirador (K-18): bloco camera: do Xiaomi Cloud Map Extractor removido em 14/10/2026 (login exige captcha). Para religar: scripts/manutencao/ativa_mapa_aspirador.py
