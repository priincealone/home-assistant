
# Loads default set of integrations. Do not remove.
default_config:

# Load frontend themes from the themes folder
frontend:
  themes: !include_dir_merge_named themes
  extra_module_url:
    # ?v= força os aparelhos a buscar a versão nova (a HA serve /local com cache de 31 dias).
    - /local/casa-panel.js?v=20261006

# Painel Nativo do Dashboard Next.js
panel_custom:
  - name: casa-panel
    sidebar_title: "Casa Inteligente"
    sidebar_icon: "mdi:home-variant"
    url_path: "casa"
    module_url: "/local/casa-panel.js?v=20261006"
    trust_external_script: true
    require_admin: false
    handle_safe_area: true

# Dashboard Lovelace Integrado (permite definir como Dashboard Padrão no perfil)
lovelace:
  dashboards:
    casa-dashboard:
      mode: yaml
      title: "Casa Inteligente"
      icon: "mdi:home-variant"
      show_in_sidebar: false
      filename: dashboards/casa.yaml

automation: !include automations.yaml
script: !include scripts.yaml
scene: !include scenes.yaml
template: !include template_sensors.yaml
command_line: !include rede_ping.yaml

# Guarda se a queda de internet já foi avisada, para só avisar o retorno de queda que alarmou.
input_boolean:
  rede_queda_notificada:
    name: Queda de internet avisada
    icon: mdi:wifi-alert

# Silencia o aviso "Connection pool is full" da nuvem Tuya (apigw.tuyaus.com): a biblioteca
# descarta a conexão excedente e segue funcionando; o aviso é só ruído no log.
logger:
  default: warning
  logs:
    urllib3.connectionpool: error

# Mapa do aspirador (Xiaomi Cloud Map Extractor): K-18, specs/features/mapa-aspirador.md
camera:
  - platform: xiaomi_cloud_map_extractor
    name: Mapa do aspirador
    host: !secret mapa_aspirador_ip
    token: !secret mapa_aspirador_token
    username: !secret mapa_xiaomi_usuario
    password: !secret mapa_xiaomi_senha
    country: us
    draw: ["all"]
    attributes: [calibration_points, rooms, room_numbers, vacuum_room_name]
    scan_interval: 60
    store_map_raw: false
    store_map_image: false
