
# Loads default set of integrations. Do not remove.
default_config:

# Load frontend themes from the themes folder
frontend:
  themes: !include_dir_merge_named themes

automation: !include automations.yaml
script: !include scripts.yaml
scene: !include scenes.yaml
template: !include template_sensors.yaml


# Interruptor do modo quiosque (tela cheia). Desligado = cabecalho e barra
# lateral do Home Assistant visiveis, inclusive no celular; ligado = tela cheia.
# Lido pelo bloco `kiosk_mode` da dashboard "Casa".
input_boolean:
  modo_quiosque:
    name: Modo quiosque
    icon: mdi:fullscreen
