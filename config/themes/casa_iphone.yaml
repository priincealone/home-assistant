# Tema para o iPhone do André (pedido de 26/11/2026): no app Companion a barra de status fica
# escondida, então a margem que a HA reserva para a Dynamic Island sobrava vazia e o cabeçalho
# ocupava muito. Com este tema a margem do topo encolhe (ver o 2º ajuste abaixo)
# e a barra de abas encolhe de 56 para 48px.
#
# Escolha POR APARELHO: no iPhone, Perfil > Tema > casa_iphone. Não use como tema padrão do
# sistema: no iPad e em aparelho com barra de status visível o relógio cobriria as abas.
# (Tema por visão não serve: a HA aplica o tema da visão só ao conteúdo, não ao cabeçalho.)
# max(...) mantém 0 onde não há entalhe. Os "modes" vazios mantêm o modo claro/escuro padrão.
#
# 26/11/2026 (2º ajuste): com o kiosk-mode escondendo o cabeçalho do dashboard Casa, 4px deixava o
# "Bom dia, André" embaixo da Dynamic Island. Agora a margem é a do aparelho menos 10px (~49px num
# iPhone com ilha, que termina em ~48px): o conteúdo começa logo abaixo da ilha.
casa_iphone:
  safe-area-inset-top: "max(calc(env(safe-area-inset-top, 0px) - 10px), 0px)"
  header-height: "48px"
  modes:
    light: {}
    dark: {}
